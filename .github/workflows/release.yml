name: Release

# Run by hand with the version to publish. The version lives in the tag and on
# npm, not in a commit: package.json on `main` stays at 0.0.0, so a release
# never needs to push past the `main` ruleset. The npm package's trusted
# publisher is configured for this file name and the `npm` environment —
# renaming either breaks publishing.
#
# Running it is the release: it publishes to npm, then publishes the GitHub
# Release, which creates the tag. The gate is who can run it: the `npm`
# environment deploys only from protected branches, and the trusted publisher
# on npmjs.com must allow `npm publish`. See CONTRIBUTING.md#releasing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # Create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a job holding publish credentials.
          package-manager-cache: false

      # `npm version` rejects non-semver itself, but accepts a leading `v`,
      # which would then produce a `vv…` tag. npm is checked before verify, so
      # a version already published fails fast.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version (no leading v)."
            exit 1
          fi
          if [[ -n "$(npm view "@composure-labs/composurecdk-stream-dlq@$VERSION" version 2>/dev/null)" ]]; then
            echo "::error::$VERSION is already on npm."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Before verify, so the package verify checks has the published version.
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Verify
        run: npm run verify

      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than some Node
      # 24 releases bundle. Provenance is added automatically. npm refuses a
      # prerelease without a tag, so one goes to `next`, not `latest`.
      - name: Publish to npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=next; fi
          npx -y npm@^11.5.1 publish --tag "$tag"

      # After npm, so a failed publish leaves no tag behind.
      - name: Publish GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
