name: Release

# Run by hand with the version to publish. The version lives in the tag and on
# npm, not in a commit: package.json on `main` stays at 0.0.0, so a release
# never needs to push past the `main` ruleset. The npm package's trusted
# publisher is configured for this file name and the `npm` environment —
# renaming either breaks publishing.
#
# Releases are staged: this workflow submits the version for review and drafts
# the GitHub Release. Nothing is public until a maintainer approves it with 2FA
# (`npm stage approve <stage-id>`, or Staged Packages on npmjs.com), then
# publishes the draft, which creates the tag. See CONTRIBUTING.md#releasing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # Draft the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a job holding publish credentials.
          package-manager-cache: false

      # `npm version` rejects non-semver itself, but accepts a leading `v`,
      # which would then produce a `vv…` tag. A draft counts as released, so a
      # version can't be staged twice.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version (no leading v)."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      # Staged publishing needs npm >= 11.15.0. The trusted publisher allows
      # only `npm stage publish`, so even a compromised run can't publish.
      - name: Stage on npm
        run: npx -y npm@^11.15.0 stage publish

      # A draft creates no tag; publishing it after npm approval does.
      - name: Draft GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          {
            echo "### v$VERSION is staged, not published"
            echo
            echo "1. \`npm stage list @composure-labs/composurecdk-stream-dlq\`, then \`npm stage approve <stage-id>\` (2FA)."
            echo "2. Publish the draft release v$VERSION, which creates the tag."
          } >> "$GITHUB_STEP_SUMMARY"
