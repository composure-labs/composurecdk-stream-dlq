version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a release, so a compromised or broken one is
    # more likely to have been yanked before we adopt it. Security updates are
    # not held back. zizmor's dependabot-cooldown audit requires >= 7 days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The compat loop. Every peer is mirrored as a devDependency with the same
    # range (scripts/check-peer-mirror.mjs enforces it). Dependabot ignores
    # peerDependencies, but rewrites a peer whose range is identical to the
    # devDependency it bumps. `widen` turns `^0.11.0` into `^0.11.0 || ^0.12.0`
    # when composureCDK ships a new minor, so the published peer range admits
    # it while still admitting the old one. An in-range update (a CDK minor
    # inside `^2.184.0`) is lockfile-only and leaves the ranges alone.
    versioning-strategy: widen
    ignore:
      # typescript-eslint cannot run on TS 7 (its parser's peer range stops
      # below it). Same pin as composureCDK; delete it once
      # typescript-eslint/typescript-eslint#10940 closes.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # One PR per composureCDK release, so the peers move together and the
      # PR reads as "admit composureCDK 0.x".
      composurecdk:
        patterns:
          - "@composurecdk/*"
      aws-cdk:
        patterns:
          - "aws-cdk-lib"
          - "constructs"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-config-prettier"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@composurecdk/*"
          - "aws-cdk-lib"
          - "constructs"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-config-prettier"

  # zizmor, which CI installs from this hash-pinned lock.
  - package-ecosystem: uv
    directory: /.github/zizmor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
